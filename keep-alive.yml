name: Keep Render Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que el servicio responda
        run: curl --fail --show-error --retry 3 --retry-all-errors --max-time 60 https://fluxmedia-pro.onrender.com/health
