services:
  - type: web
    name: fluxmedia-pro
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: ENABLE_DIARIZATION
        value: "false"
      - key: TRANSCRIPTION_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
